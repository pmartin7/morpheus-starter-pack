name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

jobs:
  build:
    name: Clean-checkout build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Frozen lockfile from a clean checkout catches undeclared dependencies
      # that only resolve locally through hoisting.
      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm build
